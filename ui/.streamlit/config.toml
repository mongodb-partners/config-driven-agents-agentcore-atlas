codeTextColor                  = "#C1C7C6"  # gray.light1
dataframeBorderColor           = "#3D4F58"  # gray.dark2
dataframeHeaderBackgroundColor = "#1C2D38"  # gray.dark3

greenColor  = "#00ED64"
greenTextColor  = "#71F6BA"
greenBackgroundColor  = "#023430"
redColor    = "#FF6960"
redTextColor    = "#FFCDC7"
redBackgroundColor    = "#5B0000"
yellowColor = "#FFC010"
